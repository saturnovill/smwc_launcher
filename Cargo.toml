[package]
name = "smw-launcher"
version = "0.1.1"
edition = "2024"

[dependencies]
cpal = "0.18.2"
crc32fast = "1.5.2"
eframe = { version = "0.36.2", features = ["persistence"] }
egui_extras = { version = "0.36.2", features = ["http", "image"] }
gilrs = "0.11.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
libloading = "0.9.0"
libretro-sys = "0.1.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
ureq = { version = "3.4.2", features = ["json"] }
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
lto = "thin"

[dev-dependencies]
serde_json = "1.0.154"
